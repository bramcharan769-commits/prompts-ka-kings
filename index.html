<!DOCTYPE html>
<html>
<head>
<title>Prompts Ka Kings</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#141E30,#243B55);
color:white;
text-align:center;
margin:0;
}

header{
font-size:40px;
padding:20px;
background:black;
color:gold;
letter-spacing:2px;
}

.section{
margin:30px;
padding:20px;
border-radius:15px;
background:rgba(255,255,255,0.08);
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.images{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin-top:15px;
}

.images img{
width:130px;
height:130px;
object-fit:cover;
border-radius:12px;
border:2px solid white;
}

textarea{
width:80%;
height:120px;
border-radius:10px;
padding:10px;
font-size:16px;
border:none;
outline:none;
}

input{
margin-top:10px;
}

.creator{
font-size:14px;
opacity:0.7;
margin-top:20px;
}

</style>
</head>

<body>

<header>
Prompts Ka Kings
</header>

<div class="section">

<h2>Top Image Upload</h2>

<input type="file" multiple accept="image/*" onchange="topImages(event)">

<div class="images" id="topPreview"></div>

</div>

<div class="section">

<h2>Creator Prompt</h2>

<textarea placeholder="Type your prompt here..."></textarea>

</div>

<div class="section">

<h2>Bottom Image Upload</h2>

<input type="file" multiple accept="image/*" onchange="bottomImages(event)">

<div class="images" id="bottomPreview"></div>

</div>

<div class="creator">
Creator Access Only
</div>

<script>

function topImages(event){

let preview=document.getElementById("topPreview");

for(let file of event.target.files){

let img=document.createElement("img");

img.src=URL.createObjectURL(file);

preview.appendChild(img);

}

}

function bottomImages(event){

let preview=document.getElementById("bottomPreview");

for(let file of event.target.files){

let img=document.createElement("img");

img.src=URL.createObjectURL(file);

preview.appendChild(img);

}

}

</script>

</body>
</html>
